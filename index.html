        .navi-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            line-height: 1.5;

        .video-list { display: flex; flex-direction: column; gap: 15px; }
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;

        .video-badge {

            font-weight: bold;
            padding: 3px 6px;

            border-left: 3px solid var(--accent-color);
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #fff;
            font-family: monospace;
            margin-top: 5px;

        .btn-play {

            text-align: center;
            background-color: #238636;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
