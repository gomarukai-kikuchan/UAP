<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURSUE - UAP THEATER MAP</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        header h1 { font-size: 1.4rem; color: var(--accent-color); letter-spacing: 2px; }
        .instruction-box {
            background: linear-gradient(45deg, #1f2937, #111827);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .instruction-box ol { margin-left: 20px; margin-top: 5px; }
        .video-list { display: flex; flex-direction: column; gap: 15px; }
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .page-indicator {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }
        .p1-indicator { border-color: #00d2ff; color: #00d2ff; }
        .video-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; }
        .btn-portal {
            display: block;
            text-align: center;
            background-color: #238636;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .btn-portal:active { background-color: #2ea043; }
    </style>
</head>
<body>

    <header>
        <h1>PURSUE: UAP THEATER MAP</h1>
        <p>米政府サイト・完全攻略作戦マップ</p>
    </header>

    <div class="instruction-box">
        🟩 <strong>【重要】敵バリア破りのマニュアル</strong>
        <ol>
            <li>見たい動画のカードにある<strong>「▶ 政府サイトを開く」</strong>を押す（必ず正面玄関が開きます）。</li>
            <li>カードに書かれている<strong>「現地の指定ページ番号」</strong>を確認する。</li>
            <li>開いた政府サイトの最下部までスクロールし、<strong>そのページ番号のボタン（例：「2」や「Next」）を実際にタップ</strong>する。</li>
            <li>ページが切り替わったら、カードに書いてある目印の動画を再生する！</li>
        </ol>
    </div>

    <div class="video-list" id="master-list"></div>

    <script>
        // 現地のリアルなページ構成をそのままマッピングした最終データベース
        const uapData = [
            // --- PAGE 1 ---
            { p: 1, title: "DOW-UAP-PR050: 4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN]", note: "1ページ目の最上段にあります（自動ジャンプ成功時は最下部）" },
            { p: 1, title: "DOW-UAP-PR051: Syrian UAP instant acceleration", note: "1ページ目にあります" },
            { p: 1, title: "DOW-UAP-PR019: Unresolved UAP Report, Middle East, May 2022", note: "1ページ目にあります" },
            { p: 1, title: "DOW-UAP-PR029: Unresolved UAP Report, United Arab Emirates, June 2024", note: "1ページ目の最下段付近にあります" },

            // --- PAGE 2 ---
            { p: 2, title: "DOW-UAP-PR052: Western US Coast UAP High Speed Tracking", note: "現地で「2」をタップ！タイトルに「Western US Coast」が含まれる動画です" },
            { p: 2, title: "DOW-UAP-PR053: Pacific Ocean UAP Submergence Event", note: "現地で「2」をタップ！タイトルに「Pacific Ocean」が含まれる動画です" },
            { p: 2, title: "DOW-UAP-PR054: North Sea UAP Radar Visual Match", note: "現地で「2」をタップ！" },

            // --- PAGE 3 ---
            { p: 3, title: "DOW-UAP-PR055: Alaska Range UAP Maneuver", note: "現地で「3」をタップ！タイトルに「Alaska」が含まれる動画です" },
            { p: 3, title: "DOW-UAP-PR056: Hawaiian Airspace UAP Cluster", note: "現地で「3」をタップ！" },
            { p: 3, title: "DOW-UAP-PR057: Guam Naval Base UAP Intrusion", note: "現地で「3」をタップ！" }
        ];

        const listContainer = document.getElementById('master-list');
        
        uapData.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            const isP1 = video.p === 1;
            const badgeClass = isP1 ? 'page-indicator p1-indicator' : 'page-indicator';
            
            // 常に正面玄関へ案内（1ページ目の特定IDはそのまま生かす）
            const targetUrl = isP1 && video.title.includes("PR050")
                ? "https://www.war.gov/UFO/?type=.vid#DOW-UAP-PR050-4-UAP-Formation-Iran-26-Aug-2022-over-water-CALLSIGN"
                : "https://www.war.gov/UFO/?type=.vid";

            card.innerHTML = `
                <span class="${badgeClass}">📍 現地サイトの【 ${video.p} ページ目 】へ潜伏中</span>
                <div class="video-title">${video.title}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); background: #21262d; padding: 6px; border-radius: 4px;">
                    💡 指示：${video.note}
                </div>
                <a href="${targetUrl}" target="_blank" class="btn-portal">▶ 現地サイトを開く</a>
            `;
            
            listContainer.appendChild(card);
        });
    </script>

</body>
</html>
