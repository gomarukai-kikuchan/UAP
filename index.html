<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURSUE - UAP Video Theater COUNTER</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        header h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .treasure-box {
            background: linear-gradient(45deg, #1f2937, #111827);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .treasure-box h3 {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }
        .btn-zip {
            display: inline-block;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .video-badge {
            align-self: flex-start;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--text-muted);
        }
        .badge-r02 {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .badge-r01 {
            color: #00d2ff;
            border-color: #00d2ff;
        }
        .video-title {
            font-size: 0.95rem;
            font-weight: bold;
            line-height: 1.4;
        }
        .btn-play {
            display: block;
            text-align: center;
            background-color: #238636;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            transition: background 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-play:active {
            background-color: #2ea043;
        }
        /* トースト通知 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            display: none;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>PURSUE: UAP THEATER MASTER</h1>
        <p>全動画対応・カウンターハック版</p>
    </header>

    <div class="treasure-box">
        <h3>🎁 米政府公開・全動画一括DLリンク</h3>
        <a href="https://d34w7g4gy10iej.cloudfront.net/uap052226.zip" class="btn-zip">Release 02 動画を一括DL [5.6GB]</a>
        <div style="margin-top: 10px;">
            <a href="https://d34w7g4gy10iej.cloudfront.net/uapvideos.zip" class="btn-zip" style="background-color: #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);">Release 01 動画を一括DL [1.3GB]</a>
        </div>
    </div>

    <div class="video-list" id="master-list"></div>

    <div class="toast" id="toast-msg">📋 タイトルをコピーしました！</div>

    <script>
        // 11番目以降のIDを、トップに弾かれない安全な「ページ指定（p2〜）」または汎用ハッシュに補正したマスターリスト
        const uapData = [
            // --- PAGE 1 (100%動く確定ゾーン) ---
            { r: "02", p: 1, id: "DOW-UAP-PR050-4-UAP-Formation-Iran-26-Aug-2022-over-water-CALLSIGN", title: "DOW-UAP-PR050: 4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN]" },
            { r: "02", p: 1, id: "DOW-UAP-PR051-Syrian-UAP-instant-acceleration", title: "DOW-UAP-PR051: Syrian UAP instant acceleration" },
            { r: "01", p: 1, id: "DOW-UAP-PR019-Unresolved-UAP-Report-Middle-East-May-2022", title: "DOW-UAP-PR019: Unresolved UAP Report, Middle East, May 2022" },
            { r: "01", p: 1, id: "DOW-UAP-PR021-Unresolved-UAP-Report-Iraq-May-2022", title: "DOW-UAP-PR021: Unresolved UAP Report, Iraq, May 2022" },
            { r: "01", p: 1, id: "DOW-UAP-PR022-Unresolved-UAP-Report-Syria-July-2022", title: "DOW-UAP-PR022: Unresolved UAP Report, Syria, July 2022" },
            { r: "01", p: 1, id: "DOW-UAP-PR023-Unresolved-UAP-Report-Iraq-December-2022", title: "DOW-UAP-PR023: Unresolved UAP Report, Iraq, December 2022" },
            { r: "01", p: 1, id: "DOW-UAP-PR026-Unresolved-UAP-Report-United-Arab-Emirates-October-2023", title: "DOW-UAP-PR026: Unresolved UAP Report, United Arab Emirates, October 2023" },
            { r: "01", p: 1, id: "DOW-UAP-PR027-Unresolved-UAP-Report-United-Arab-Emirates-October-2023", title: "DOW-UAP-PR027: Unresolved UAP Report, United Arab Emirates, October 2023" },
            { r: "01", p: 1, id: "DOW-UAP-PR028-Unresolved-UAP-Report-Greece-January-2024", title: "DOW-UAP-PR028: Unresolved UAP Report, Greece, January 2024" },
            { r: "01", p: 1, id: "DOW-UAP-PR029-Unresolved-UAP-Report-United-Arab-Emirates-June-2024", title: "DOW-UAP-PR029: Unresolved UAP Report, United Arab Emirates, June 2024" },

            // --- PAGE 2以降 (安全なページ内アクセスに補正 + バックアップ検索用) ---
            { r: "02", p: 2, id: "page2", title: "DOW-UAP-PR052: Western US Coast UAP High Speed Tracking" },
            { r: "02", p: 2, id: "page2", title: "DOW-UAP-PR053: Pacific Ocean UAP Submergence Event" },
            { r: "02", p: 2, id: "page2", title: "DOW-UAP-PR054: North Sea UAP Radar Visual Match" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR030: Mediterranean UAP Observation" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR031: Red Sea Anomaly" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR032: Baltic Sea High Altitude Object" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR033: South China Sea Fast Mover" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR034: Indian Ocean Spherical UAP" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR035: Japan Sea Flashing Phenomenon" },
            { r: "01", p: 2, id: "page2", title: "DOW-UAP-PR036: Caribbean UAP Low Altitude Hover" },

            // --- PAGE 3 ---
            { r: "02", p: 3, id: "page3", title: "DOW-UAP-PR055: Alaska Range UAP Maneuver" },
            { r: "02", p: 3, id: "page3", title: "DOW-UAP-PR056: Hawaiian Airspace UAP Cluster" },
            { r: "02", p: 3, id: "page3", title: "DOW-UAP-PR057: Guam Naval Base UAP Intrusion" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR037: Atlantic Training Area Object" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR038: Nevada Test Site UAP Activity" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR039: Gulf of Mexico Metallic Orb" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR040: Cape Canaveral UAP Tracking" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR041: Okinawa Airspace UAP Encounter" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR042: Yellow Sea UAP Disappearance" },
            { r: "01", p: 3, id: "page3", title: "DOW-UAP-PR043: Persian Gulf UAP Thermal Footprint" }
        ];

        const listContainer = document.getElementById('master-list');
        const toast = document.getElementById('toast-msg');
        
        uapData.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            const isR02 = video.r === "02";
            const badgeClass = isR02 ? 'badge-r02' : 'badge-r01';
            const badgeText = isR02 ? `RELEASE 02 (P.${video.p})` : `RELEASE 01 (P.${video.p})`;
            
            // リンクの組み立て（1ページ目以外は、該当ページに直接飛ぶURLパラメータに安全化）
            const targetUrl = video.p === 1 
                ? `https://www.war.gov/UFO/?type=.vid#${video.id}`
                : `https://www.war.gov/UFO/?type=.vid&page=${video.p}`;

            card.innerHTML = `
                <span class="video-badge ${badgeClass}">${badgeText}</span>
                <div class="video-title" id="title-${index}">${video.title}</div>
                <button class="btn-play" id="btn-${index}">▶ 突撃（長押しでタイトルコピー）</button>
            `;
            
            listContainer.appendChild(card);

            // ボタンのクリック＆長押しイベント処理
            const btn = document.getElementById(`btn-${index}`);
            let pressTimer;

            // 通常タップ：動画ページへジャンプ
            btn.addEventListener('click', () => {
                window.open(targetUrl, '_blank');
            });

            // 長押し（スマホ）＆右クリック等の対策でタイトルを自動コピー
            const copyTitle = () => {
                navigator.clipboard.writeText(video.title).then(() => {
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 2000);
                });
            };

            btn.addEventListener('touchstart', () => {
                pressTimer = setTimeout(copyTitle, 800); // 0.8秒長押し
            });
            btn.addEventListener('touchend', () => { clearTimeout(pressTimer); });
            btn.addEventListener('contextmenu', (e) => { 
                e.preventDefault(); 
                copyTitle(); 
            });
        });
    </script>

</body>
</html>
