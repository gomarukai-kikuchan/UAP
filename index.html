<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURSUE - RELEASE 02 THEATER PERFECT</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        header h1 { font-size: 1.4rem; color: var(--accent-color); letter-spacing: 2px; }
        .navi-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .video-list { display: flex; flex-direction: column; gap: 15px; }
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .page-indicator {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }
        .p1-indicator { border-color: #00d2ff; color: #00d2ff; }
        .video-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; }
        .btn-portal {
            display: block;
            text-align: center;
            background-color: #238636;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>PURSUE: RELEASE 02 THEATER</h1>
        <p>隊長査収済・Release 02 専属パーフェクトマップ</p>
    </header>

    <div class="navi-box">
        🟩 <strong>【Release 02 攻略マニュアル】</strong><br>
        1. 「▶ 現地サイトを開く」を押して正面玄関へ。<br>
        2. スマホなら最下部の「NEXT」を指示の回数だけ押してターゲットのページへ。<br>
        3. ページ内に超高密度で潜伏している「指定のPR番号」を撃破（再生）せよ！
    </div>

    <div class="video-list" id="master-list"></div>

    <script>
        // 隊長の現地調査によって100%正解へと導かれた神データ
        const uapData = [
            // --- 1ページ目 ---
            { p: 1, title: "DOW-UAP-PR050: 4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN]", note: "1ページ目最上段（自動ジャンプ時は最下部）", url: "https://www.war.gov/UFO/?type=.vid#DOW-UAP-PR050-4-UAP-Formation-Iran-26-Aug-2022-over-water-CALLSIGN" },
            { p: 1, title: "DOW-UAP-PR051: Syrian UAP instant acceleration", note: "1ページ目に潜伏中", url: "https://www.war.gov/UFO/?type=.vid" },

            // --- 3ページ目 ---
            { p: 3, title: "DOW-UAP-PR052: UAP USO Formation [CALLSIGN] (Mission)", note: "現地でNEXTを2回押す！【3ページ目】のターゲット", url: "https://www.war.gov/UFO/?type=.vid" },

            // --- 4ページ目（密集地帯その1） ---
            { p: 4, title: "DOW-UAP-PR053 〜 PR061 の動画密集地帯", note: "現地でNEXTを3回押す！【4ページ目】にPR053(Cigar Shaped...)からPR061までが固まっています", url: "https://www.war.gov/UFO/?type=.vid" },

            // --- 5ページ目（密集地帯その2） ---
            { p: 5, title: "DOW-UAP-PR062 〜 PR071 の動画密集地帯", note: "現地でNEXTを4回押す！【5ページ目】にPR062からPR071までが固まっています", url: "https://www.war.gov/UFO/?type=.vid" },

            // --- 6ページ目（最終・最大密集地帯） ---
            { p: 6, title: "DOW-UAP-PR072 〜 PR099（Release 02 最終リリースの全軍）", note: "現地でNEXTを5回押す！【6ページ目】にPR072から、真の最終動画PR099までがすべて集結しています", url: "https://www.war.gov/UFO/?type=.vid" }
        ];

        const listContainer = document.getElementById('master-list');
        
        uapData.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            const isP1 = video.p === 1;
            const badgeClass = isP1 ? 'page-indicator p1-indicator' : 'page-indicator';

            card.innerHTML = `
                <span class="${badgeClass}">📍 現地サイトの【 ${video.p} ページ目 】に潜伏</span>
                <div class="video-title">${video.title}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); background: #21262d; padding: 6px; border-radius: 4px;">
                    🎯 攻略：${video.note}
                </div>
                <a href="${video.url}" target="_blank" class="btn-portal">▶ 現地サイトを開く</a>
            `;
            
            listContainer.appendChild(card);
        });
    </script>

</body>
</html>
