<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURSUE - RELEASE 02 THEATER PERFECT</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        header h1 { font-size: 1.4rem; color: var(--accent-color); letter-spacing: 2px; }
        .navi-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .video-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .page-indicator {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }
        .video-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; }
        .btn-portal {
            display: block;
            text-align: center;
            background-color: #238636;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            width: 100%;
        }
        /* お宝ZIPリンクコーナー用スタイル */
        .treasure-box {
            background: linear-gradient(45deg, #1f2937, #111827);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 25px;
            margin-bottom: 15px;
            text-align: center;
        }
        .treasure-box h3 {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }
        .btn-zip {
            display: inline-block;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            width: 100%;
        }
    </style>
</head>
<body>

    <header>

    </header>

        <a href="https://d34w7g4gy10iej.cloudfront.net/uap052226.zip" class="btn-zip">Release 02 動画を丸ごと落とす [5.6GB]</a>
        <div style="margin-top: 10px;">
            <a href="https://d34w7g4gy10iej.cloudfront.net/uapvideos.zip" class="btn-zip" style="background-color: #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); color: #000;">Release 01 動画を丸ごと落とす [1.3GB]</a>
        </div>
    </div>

    <script>
        // すべてのバグとズレを修正した最終マスターデータ
        const uapData = [
            // --- 1ページ目 ---
            { p: "1 ページ目", title: "DOW-UAP-PR050: 4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN]", note: "1ページ目最上段にあります（自動ジャンプ時は最下部）", url: "https://www.war.gov/UFO/?type=.vid#DOW-UAP-PR050-4-UAP-Formation-Iran-26-Aug-2022-over-water-CALLSIGN" },

            // --- 4ページ目 ---
            { p: "4 ページ目", title: "DOW-UAP-PR053 〜 PR061 の動画密集地帯", note: "現地でNEXTを3回押す！【4ページ目】にPR053(Cigar Shaped...)からPR061までが固まっています", url: "https://www.war.gov/UFO/?type=.vid" },

            // --- 5ページ目 ---
            { p: "5 ページ目", title: "DOW-UAP-PR062 〜 PR071 の動画密集地帯", note: "現地でNEXTを4回押す！【5ページ目】にPR062からPR071までが固まっています", url: "https://www.war.gov/UFO/?type=.vid" },

        const listContainer = document.getElementById('master-list');
        
        uapData.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            card.innerHTML = `
                <span class="page-indicator">📍 現地サイトの【 ${video.p} 】に潜伏</span>
                <div class="video-title">${video.title}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); background: #21262d; padding: 6px; border-radius: 4px;">
                    🎯 攻略：${video.note}
                </div>
                <a href="${video.url}" target="_blank" class="btn-portal">▶ 現地サイトを開く</a>

            listContainer.appendChild(card);
        });
    </script>

</body>
</html>
