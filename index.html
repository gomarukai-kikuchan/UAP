<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURSUE - UAP THEATER FULL MAP</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }
        header h1 { font-size: 1.4rem; color: var(--accent-color); letter-spacing: 2px; }
        .navi-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .video-list { display: flex; flex-direction: column; gap: 15px; }
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .page-indicator {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }
        .p1-indicator { border-color: #00d2ff; color: #00d2ff; }
        .video-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; }
        .btn-portal {
            display: block;
            text-align: center;
            background-color: #238636;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>PURSUE: UAP THEATER FULL MAP</h1>
        <p>全8ページ完全網羅・真の作戦マップ</p>
    </header>

    <div class="navi-box">
        🟩 <strong>【完全版】敵バリア破りのマニュアル</strong><br>
        1. 「▶ 現地サイトを開く」を押して正面玄関へ。<br>
        2. スマホなら最下部の「NEXT」を指定の回数ポチポチ押して進む。<br>
        3. 指定された<strong>「動画番号（PRxxx）」</strong>を目印に再生！
    </div>

    <div class="video-list" id="master-list"></div>

    <script>
        // 全8ページ分の動画番号（PR番号）の潜伏先マッピング
        const uapData = [
            // --- 1ページ目 (確定ゾーン) ---
            { p: 1, title: "DOW-UAP-PR050: 4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN]", note: "1ページ目最上段にあります" },
            { p: 1, title: "DOW-UAP-PR051: Syrian UAP instant acceleration", note: "1ページ目にあります" },
            { p: 1, title: "DOW-UAP-PR019 〜 PR029 の動画群", note: "1ページ目にまとめて並んでいます" },

            // --- 3ページ目 (偵察完了) ---
            { p: 3, title: "DOW-UAP-PR052 (UAP USO Formation...)", note: "現地でNEXTを2回押し【3ページ目】へ！「PR052」が目印" },

            // --- 4ページ目 (偵察完了) ---
            { p: 4, title: "DOW-UAP-PR053 (Cigar Shaped...)", note: "現地でNEXTを3回押し【4ページ目】へ！「PR053」が目印" },

            // --- 5ページ目 (未踏エリア) ---
            { p: 5, title: "DOW-UAP-PR054 〜 PR059 付近の動画群", note: "現地でNEXTを4回押し【5...ページ目】へ！「PR054〜」が潜伏しているエリアです" },

            // --- 6ページ目 (未踏エリア) ---
            { p: 6, title: "DOW-UAP-PR060 〜 PR065 付近の動画群", note: "現地でNEXTを5回押し【6ページ目】へ！「PR060〜」が潜伏しているエリアです" },

            // --- 7ページ目 (未踏エリア) ---
            { p: 7, title: "DOW-UAP-PR066 〜 PR071 付近の動画群", note: "現地でNEXTを6回押し【7ページ目】へ！「PR066〜」が潜伏しているエリアです" },

            // --- 8ページ目 (最終エリア) ---
            { p: 8, title: "DOW-UAP-PR072 〜 PR077（最終リリース群）", note: "現地でNEXTを7回押し、最深部【8ページ目】へ！Release 02の最終動画たちが眠っています" }
        ];

        const listContainer = document.getElementById('master-list');
        
        uapData.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            const isP1 = video.p === 1;
            const badgeClass = isP1 ? 'page-indicator p1-indicator' : 'page-indicator';
            
            // 常に安全な正面玄関のURLをセット
            const targetUrl = isP1 && video.title.includes("PR050")
                ? "https://www.war.gov/UFO/?type=.vid#DOW-UAP-PR050-4-UAP-Formation-Iran-26-Aug-2022-over-water-CALLSIGN"
                : "https://www.war.gov/UFO/?type=.vid";

            card.innerHTML = `
                <span class="${badgeClass}">📍 現地サイトの【 ${video.p} ページ目 】に潜伏</span>
                <div class="video-title">${video.title}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted); background: #21262d; padding: 6px; border-radius: 4px;">
                    🎯 攻略ヒント：${video.note}
                </div>
                <a href="${targetUrl}" target="_blank" class="btn-portal">▶ 現地サイトを開く</a>
            `;
            
            listContainer.appendChild(card);
        });
    </script>

</body>
</html>
